name: harness-ci

# Automated acceptance for the TypeScript harness (L2): typecheck + smoke tests +
# 100% coverage of the runtime surface. The bridge contract (T1) and every adapter
# (T2+) must stay green here.
#
# Runs on EVERY pull request (no paths filter) so it can be a *required* status
# check: a path-filtered required check never reports on unrelated PRs and would
# block them forever. npm is cached, so a no-harness PR still completes in ~15s.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-ci:
    name: harness-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci
      - name: typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: test + coverage gate (100% runtime surface)
        run: npm run test:coverage
